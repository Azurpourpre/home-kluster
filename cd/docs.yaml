apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    name: docs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docs
  namespace: docs
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/docs/kube"
  prune: true