apiVersion: v1
kind: Namespace
metadata:
  name: wger
  labels:
    name: wger
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: wger
  namespace: wger
spec:
  interval: 12h
  url: https://wger-project.github.io/helm-charts
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wger-values
  namespace: wger
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/wger"
  prune: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wger
  namespace: wger
spec:
  chart:
    spec:
      chart: wger
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: wger
  valuesFrom:
  - kind: ConfigMap
    name: wger-values
  interval: 12h