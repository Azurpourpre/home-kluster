apiVersion: v1
kind: Namespace
metadata:
  name: fluentbit
  labels:
    name: fluentbit
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluentbit
  namespace: fluentbit
spec:
  interval: 12h
  url: https://fluent.github.io/helm-charts
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluentbit-values
  namespace: fluentbit
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/fluentbit"
  prune: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluentbit
  namespace: fluentbit
spec:
  chart:
    spec:
      chart: fluent-bit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: fluentbit
  valuesFrom:
  - kind: ConfigMap
    name: fluentbit-values
  interval: 12h