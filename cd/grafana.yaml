apiVersion: v1
kind: Namespace
metadata:
  name: grafana
  labels:
    name: grafana
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 12h
  url: https://grafana.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: grafana
spec:
  interval: 12h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: values
  namespace: grafana
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/grafana"
  prune: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: grafana
spec:
  interval: 12h
  timeout: 5m
  chart: 
    spec: 
      chart: loki-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana
  valuesFrom:
  - kind: ConfigMap
    name: loki-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 12h
  timeout: 5m
  chart: 
    spec: 
      chart: grafana
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  valuesFrom:
  - kind: ConfigMap
    name: grafana-values
