apiVersion: v1
kind: Secret
metadata:
  name: cd-trusted-pgp
  namespace: default
type: Opaque
data:
  azurpourpre.asc: 
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: remote-git
  namespace: default
spec:
  interval: 4h
  url: https://github.com/Azurpourpre/home-kluster.git
  provider: generic
  ref:
    branch: master
  verify:
    mode: HEAD
    secretRef:
      name: cd-trusted-pgp
  sparseCheckout:
  - cd
  - misc
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-kluster
  namespace: default
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    name: remote-git
  path: cd
  prune: true
