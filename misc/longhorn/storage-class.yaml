kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-xfs
  namespace: longhorn
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fromBackup: ""
  fsType: "xfs"
  recurringJobsSelector: '[
    {
      "name":"backup",
      "isGroup":false
    }
  ]'
