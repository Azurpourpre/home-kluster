apiVersion: v1
kind: Namespace
metadata:
  name: baikal
  labels:
    name: baikal
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baikal
  namespace: baikal
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    name: remote-git
  path: "misc/baikal"
  prune: true