apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    name: openbao
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 12h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  chart:
    spec:
      chart: openbao
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: openbao
      values:
        server:
          serviceAccount:
            name: openbao-sa
  interval: 12h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-additions
  namespace: openbao
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    name: remote-git
  path: "misc/openbao"
  prune: true