apiVersion: v1
kind: Namespace
metadata:
  name: cluster-secrets
  labels:
    name: cluster-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: cluster-secrets
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/secrets"
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg