apiVersion: v1
kind: Namespace
metadata:
  name: mealie
  labels:
    name: mealie
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
  namespace: mealie
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    name: remote-git
  path: "misc/mealie"
  prune: true