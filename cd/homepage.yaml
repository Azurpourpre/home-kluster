apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    name: homepage
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    namespace: default
    name: remote-git
  path: "misc/homepage/kube"
  prune: true